<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素跳跃大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
body{width:100%;height:100%;overflow:hidden;background:#87CEEB;font-family:sans-serif}
#gameCanvas{display:block;width:100vw;height:80vh;background:linear-gradient(#87CEEB,#B0E0E6)}

/* 顶部UI */
.top-ui{
    position:fixed;top:10px;left:0;right:0;
    display:flex;justify-content:space-between;padding:0 20px;
    color:#fff;font-size:18px;font-weight:bold;
    text-shadow:0 2px 4px rgba(0,0,0,0.6);
    z-index:10;pointer-events:none;
}

/* 触控按键 */
.controls{
    position:fixed;bottom:20px;left:0;right:0;
    display:flex;justify-content:space-between;padding:0 30px;
    z-index:10;
}
.dir-btns{display:flex;gap:20px}
.btn{
    width:70px;height:70px;border-radius:50%;
    background:rgba(255,255,255,0.4);
    border:3px solid rgba(255,255,255,0.7);
    color:#333;font-size:28px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;
}
.btn:active{background:rgba(255,255,255,0.7);transform:scale(0.95)}
.jump-btn{background:rgba(255,80,80,0.6);border-color:rgba(255,255,255,0.8);color:#fff}

/* 结算面板 */
.panel{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;gap:20px;z-index:50;
}
.panel h2{font-size:32px}
.panel p{font-size:18px}
.restart{
    padding:12px 40px;background:#2ecc71;border:none;
    border-radius:8px;color:#fff;font-size:18px;font-weight:bold;
}
</style>
</head>
<body>
<div class="top-ui">
    <div>金币: <span id="coinCount">0</span></div>
    <div>生命: <span id="life">3</span></div>
</div>
<canvas id="gameCanvas"></canvas>

<div class="controls">
    <div class="dir-btns">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn jump-btn" id="btnJump">跳</div>
</div>

<div class="panel" id="panel">
    <h2 id="panelTitle">游戏结束</h2>
    <p>收集金币: <span id="finalCoin">0</span></p>
    <button class="restart" onclick="restart()">重新开始</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const coinEl = document.getElementById('coinCount');
const lifeEl = document.getElementById('life');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const finalCoin = document.getElementById('finalCoin');

// 画布尺寸
function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight * 0.8;
}
resize();
addEventListener('resize', resize);

// 游戏常量
const GRAVITY = 0.6;
const JUMP_FORCE = -13;
const MOVE_SPEED = 4;
const TILE = 40;

// 玩家
const player = {
    x: 80, y: 300, w: 32, h: 40,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1
};

// 关卡数据：地面、平台、金币、敌人、终点
const level = {
    grounds: [
        {x:0, y:520, w:600, h:80},
        {x:720, y:520, w:500, h:80},
        {x:1320, y:520, w:800, h:80}
    ],
    platforms: [
        {x:250, y:420, w:120, h:20},
        {x:450, y:350, w:120, h:20},
        {x:800, y:400, w:150, h:20},
        {x:1000, y:320, w:120, h:20},
        {x:1450, y:380, w:180, h:20},
        {x:1700, y:300, w:120, h:20}
    ],
    coins: [
        {x:280,y:380},{x:320,y:380},{x:480,y:310},{x:520,y:310},
        {x:850,y:360},{x:900,y:360},{x:1030,y:280},{x:1070,y:280},
        {x:1500,y:340},{x:1550,y:340},{x:1730,y:260},{x:1770,y:260},
        {x:200,y:480},{x:1380,y:480},{x:1600,y:480}
    ],
    enemies: [
        {x:400,y:480,w:30,h:30,vx:-1.5,minX:300,maxX:550},
        {x:900,y:480,w:30,h:30,vx:1.5,minX:750,maxX:1100},
        {x:1500,y:480,w:30,h:30,vx:-2,minX:1350,maxX:1800}
    ],
    flag: {x:1950, y:380, w:30, h:140}
};

let coins = 0;
let lives = 3;
let gameOver = false;
let cameraX = 0;
let keys = {left:false, right:false, jump:false};

// 触控绑定
function bindBtn(id, key){
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', e=>{e.preventDefault();keys[key]=true;});
    btn.addEventListener('touchend', e=>{e.preventDefault();keys[key]=false;});
}
bindBtn('btnLeft','left');
bindBtn('btnRight','right');
bindBtn('btnJump','jump');

// 碰撞检测
function rectHit(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// 游戏主循环
function loop(){
    if(gameOver) return;
    requestAnimationFrame(loop);
    update();
    draw();
}

function update(){
    // 移动
    if(keys.left){player.vx = -MOVE_SPEED; player.facing=-1;}
    else if(keys.right){player.vx = MOVE_SPEED; player.facing=1;}
    else player.vx = 0;

    // 跳跃
    if(keys.jump && player.onGround){
        player.vy = JUMP_FORCE;
        player.onGround = false;
    }

    // 重力
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
    player.onGround = false;

    // 地面碰撞
    level.grounds.forEach(g=>{
        if(rectHit(player, g)){
            if(player.vy > 0 && player.y+player.h - player.vy <= g.y){
                player.y = g.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    });

    // 平台碰撞
    level.platforms.forEach(p=>{
        if(rectHit(player, p)){
            if(player.vy > 0 && player.y+player.h - player.vy <= p.y){
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    });

    // 掉坑扣血
    if(player.y > 700){
        hurt();
        respawn();
    }

    // 金币收集
    for(let i=level.coins.length-1; i>=0; i--){
        const c = level.coins[i];
        if(Math.abs(player.x+player.w/2 - c.x) < 25 && Math.abs(player.y+player.h/2 - c.y) < 25){
            level.coins.splice(i,1);
            coins++;
            coinEl.textContent = coins;
        }
    }

    // 敌人更新
    level.enemies.forEach(e=>{
        e.x += e.vx;
        if(e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;

        if(rectHit(player, e)){
            // 踩头消灭
            if(player.vy > 0 && player.y+player.h - player.vy <= e.y+10){
                e.x = -9999;
                player.vy = JUMP_FORCE * 0.6;
                coins += 2;
                coinEl.textContent = coins;
            } else {
                hurt();
                respawn();
            }
        }
    });

    // 终点通关
    if(rectHit(player, level.flag)){
        winGame();
    }

    // 相机跟随
    cameraX = player.x - canvas.width/2 + player.w/2;
    cameraX = Math.max(0, Math.min(cameraX, 2100 - canvas.width));
}

function hurt(){
    lives--;
    lifeEl.textContent = lives;
    if(lives <= 0) endGame();
}

function respawn(){
    player.x = 80;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
}

function endGame(){
    gameOver = true;
    panelTitle.textContent = '游戏失败';
    finalCoin.textContent = coins;
    panel.style.display = 'flex';
}

function winGame(){
    gameOver = true;
    panelTitle.textContent = '🎉 通关成功！';
    finalCoin.textContent = coins;
    panel.style.display = 'flex';
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(-cameraX, 0);

    // 背景云朵
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for(let i=0; i<8; i++){
        const cx = i*300 + 100;
        ctx.beginPath();
        ctx.arc(cx, 80, 30, 0, Math.PI*2);
        ctx.arc(cx+30, 70, 35, 0, Math.PI*2);
        ctx.arc(cx+60, 80, 30, 0, Math.PI*2);
        ctx.fill();
    }

    // 地面
    ctx.fillStyle = '#8B4513';
    level.grounds.forEach(g=>{
        ctx.fillRect(g.x, g.y, g.w, g.h);
        ctx.fillStyle = '#228B22';
        ctx.fillRect(g.x, g.y, g.w, 15);
        ctx.fillStyle = '#8B4513';
    });

    // 平台
    ctx.fillStyle = '#CD853F';
    level.platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));

    // 金币
    ctx.fillStyle = '#FFD700';
    level.coins.forEach(c=>{
        ctx.beginPath();
        ctx.arc(c.x, c.y, 12, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#FFA500';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#FFD700';
    });

    // 敌人
    ctx.fillStyle = '#8B0000';
    level.enemies.forEach(e=>{
        if(e.x < -1000) return;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x+6, e.y+8, 6, 6);
        ctx.fillRect(e.x+18, e.y+8, 6, 6);
        ctx.fillStyle = '#8B0000';
    });

    // 终点旗帜
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(level.flag.x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = '#FF4500';
    ctx.beginPath();
    ctx.moveTo(level.flag.x+6, level.flag.y);
    ctx.lineTo(level.flag.x+50, level.flag.y+25);
    ctx.lineTo(level.flag.x+6, level.flag.y+50);
    ctx.fill();

    // 玩家
    ctx.fillStyle = '#FF6347';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    // 帽子
    ctx.fillStyle = '#DC143C';
    ctx.fillRect(player.x-2, player.y, player.w+4, 10);
    // 眼睛
    ctx.fillStyle = '#fff';
    const eyeX = player.facing > 0 ? player.x+18 : player.x+6;
    ctx.fillRect(eyeX, player.y+14, 8, 8);
    ctx.fillStyle = '#000';
    ctx.fillRect(eyeX+3, player.y+16, 3, 4);
    // 鞋子
    ctx.fillStyle = '#444';
    ctx.fillRect(player.x+2, player.y+player.h-6, 12, 6);
    ctx.fillRect(player.x+player.w-14, player.y+player.h-6, 12, 6);

    ctx.restore();
}

function restart(){
    coins = 0;
    lives = 3;
    gameOver = false;
    coinEl.textContent = 0;
    lifeEl.textContent = 3;
    panel.style.display = 'none';
    respawn();
    // 重置金币和敌人
    level.coins = [
        {x:280,y:380},{x:320,y:380},{x:480,y:310},{x:520,y:310},
        {x:850,y:360},{x:900,y:360},{x:1030,y:280},{x:1070,y:280},
        {x:1500,y:340},{x:1550,y:340},{x:1730,y:260},{x:1770,y:260},
        {x:200,y:480},{x:1380,y:480},{x:1600,y:480}
    ];
    level.enemies = [
        {x:400,y:480,w:30,h:30,vx:-1.5,minX:300,maxX:550},
        {x:900,y:480,w:30,h:30,vx:1.5,minX:750,maxX:1100},
        {x:1500,y:480,w:30,h:30,vx:-2,minX:1350,maxX:1800}
    ];
    loop();
}

// 启动
loop();
</script>
</body>
</html>
