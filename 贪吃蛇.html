<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}
.game-info {
    display: flex;
    gap: 40px;
    font-size: 20px;
    font-weight: bold;
    color: #333;
}
#gameCanvas {
    background: #2c3e50;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.btn {
    padding: 12px 36px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #27ae60;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(39,174,96,0.4);
    transition: all 0.2s;
}
.btn:hover { background: #219150; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.tip { color: #555; font-size: 14px; }
</style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>
    <div class="game-info">
        <div>得分：<span id="score">0</span></div>
        <div>最高分：<span id="best">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
    <div class="tip">使用键盘方向键 ↑ ↓ ← → 控制方向，吃到食物得分，撞墙或撞到自己游戏结束</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const startBtn = document.getElementById('startBtn');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [];
let food = {};
let direction = 'right';
let nextDirection = 'right';
let score = 0;
let bestScore = localStorage.getItem('snakeBest') || 0;
let gameTimer = null;
let gameRunning = false;

bestEl.textContent = bestScore;

// 初始化游戏
function initGame() {
    snake = [
        {x: 5, y: 10},
        {x: 4, y: 10},
        {x: 3, y: 10}
    ];
    direction = 'right';
    nextDirection = 'right';
    score = 0;
    scoreEl.textContent = 0;
    spawnFood();
    draw();
}

// 生成食物
function spawnFood() {
    while(true) {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // 食物不能生成在蛇身上
        let onSnake = false;
        for(let s of snake) {
            if(s.x === food.x && s.y === food.y) {
                onSnake = true;
                break;
            }
        }
        if(!onSnake) break;
    }
}

// 绘制画面
function draw() {
    // 清空画布
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 画食物
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + gridSize/2,
        food.y * gridSize + gridSize/2,
        gridSize/2 - 2,
        0, Math.PI * 2
    );
    ctx.fill();

    // 画蛇
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
        ctx.fillRect(
            s.x * gridSize + 1,
            s.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
        );
    });
}

// 游戏主循环
function gameLoop() {
    direction = nextDirection;
    
    // 计算新蛇头
    const head = {...snake[0]};
    if(direction === 'up') head.y--;
    if(direction === 'down') head.y++;
    if(direction === 'left') head.x--;
    if(direction === 'right') head.x++;

    // 撞墙检测
    if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
    }

    // 撞自己检测
    for(let s of snake) {
        if(s.x === head.x && s.y === head.y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    // 吃到食物
    if(head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if(score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            localStorage.setItem('snakeBest', bestScore);
        }
        spawnFood();
    } else {
        snake.pop();
    }

    draw();
}

// 游戏结束
function gameOver() {
    gameRunning = false;
    clearInterval(gameTimer);
    startBtn.disabled = false;
    startBtn.textContent = '再来一局';
    alert(`游戏结束！得分：${score} 分\n最高分：${bestScore} 分`);
}

// 开始游戏
function startGame() {
    if(gameRunning) return;
    gameRunning = true;
    startBtn.disabled = true;
    startBtn.textContent = '游戏中...';
    initGame();
    gameTimer = setInterval(gameLoop, 150);
}

// 键盘控制
document.addEventListener('keydown', e => {
    if(!gameRunning) return;
    if(e.key === 'ArrowUp' && direction !== 'down') nextDirection = 'up';
    if(e.key === 'ArrowDown' && direction !== 'up') nextDirection = 'down';
    if(e.key === 'ArrowLeft' && direction !== 'right') nextDirection = 'left';
    if(e.key === 'ArrowRight' && direction !== 'left') nextDirection = 'right';
});

// 初始绘制
initGame();
</script>
</body>
</html>
